<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <title>Simpleasety</title>
</head>
<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="brand">
            <h1>Simplease<span>ty</span></h1>
        </div>
        <div class="search-bar">
            <i id="search-icon" class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="search">
        </div>
        <div class="top-bar-actions">
            <div class="change-theme">
                <i id="light-icon" class="fa-solid fa-sun"></i>
                <button id="theme-toggle">
                    <span class="toggle-knob"></span>
                </button>
                <i id="dark-icon" class="fa-solid fa-moon"></i>
            </div>
            <button class="notification"><i class="fa-solid fa-bell"></i></button>
            <button class="profile"><i class="fa-solid fa-circle-user"></i></button>
        </div>
    </header>

    <!-- Side Bar -->
    <aside class="side-bar">
        <div class="side-bar-head">
            <div class="logo-container">
                <img src="assets/studenthub logo.png" alt="StudentHub Logo">
            </div>
            <div class="head-text">
                <h2>Student Hub</h2>
                <p>Stay organized, achieve more.</p>
            </div>
        </div>
        <nav class="side-bar-menu">
            <div class="menu Overview">
                <i class="fa-regular fa-house"></i>
                <p>Overview</p>
            </div>
            <div class="menu Tasks">
                <i class="fa-regular fa-square-check"></i>
                <p>Tasks</p>
            </div>
            <div class="menu Schedule">
                <i class="fa-regular fa-calendar"></i>
                <p>Schedule</p>
            </div>
            <div class="menu Subjects">
                <i class="fa-solid fa-book-open"></i>
                <p>Subjects</p>
            </div>
            <div class="menu Notes">
                <i class="fa-regular fa-clipboard"></i>
                <p>Notes</p>
            </div>
            <div class="menu Progress">
                <i class="fa-solid fa-chart-line"></i>
                <p>Progress</p>
            </div>
            <div class="menu Settings">
                <i class="fa-solid fa-gear"></i>
                <p>Settings</p>
            </div>
        </nav>
        <div class="side-bar-profile">
            <i class="fa-solid fa-circle-user"></i>
            <div class="profile-description">
                <h3>user</h3>
                <p>user@gmail.com</p>
            </div>
            <i class="fa-solid fa-right-from-bracket"></i>
        </div>
    </aside>

    <!-- Content Area -->
    <main class="main-content">

    </main>
    <script src="main.js"></script>
</body>
</html>
